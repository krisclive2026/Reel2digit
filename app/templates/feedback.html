{% extends "base.html" %}

{% block title %}Order Feedback — ReelToDigit{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card p-8 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-star"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">How Was Your Experience?</h2>
            <p class="text-xs text-slate-400 mt-1">Order {{ order.order_number }} Feedback</p>
        </div>

        <form action="/orders/{{ order.id }}/feedback" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2 text-center">Rating (1 to 5 Stars)</label>
                <div class="flex items-center justify-center space-x-3 text-2xl text-amber-400">
                    {% for i in range(1, 6) %}
                        <label class="cursor-pointer hover:scale-125 transition-transform">
                            <input type="radio" name="rating" value="{{ i }}" required class="sr-only peer" {% if i == 5 %}checked{% endif %}>
                            <i class="fa-solid fa-star opacity-40 peer-checked:opacity-100 peer-checked:text-amber-400"></i>
                        </label>
                    {% endfor %}
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Optional Comments / Audio Quality Review</label>
                <textarea name="comment" rows="4" placeholder="Tell us how your tape audio turned out..." class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors text-sm"></textarea>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl btn-gradient text-white font-bold text-base shadow-lg shadow-indigo-500/25">
                Submit Feedback
            </button>
        </form>
    </div>
</div>
{% endblock %}
