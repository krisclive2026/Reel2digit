{% extends "base.html" %}

{% block title %}Log In — ReelToDigit{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card p-8 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
            <p class="text-xs text-slate-400 mt-1">Sign in to track your orders and download digitized MP3/MP4s.</p>
        </div>

        <form action="/login" method="POST" class="space-y-5">
            <input type="hidden" name="next_url" value="{{ request.query_params.get('next_url', '/orders') }}">

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" name="email" required value="{{ email or '' }}" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl btn-gradient text-white font-bold text-base shadow-lg shadow-indigo-500/25">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-400">
            Don't have an account yet? <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-semibold">Sign up here</a>
        </div>
    </div>
</div>
{% endblock %}
